name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Bug Fixes
    labels:
      - bug
      - fix
  - title: Maintenance
    labels:
      - maintenance
      - dependencies
  - title: Other Changes
    labels:
      - other
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## Changes

  $CHANGES
