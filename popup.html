<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div id="header" class="header" style="display: none;">
      <img id="flag" src="" alt="Flag">
      <span id="country"></span>
    </div>
    <div class="info">
      <div class="row"><span class="label">IP:</span> <span id="ip" class="value"></span></div>
      <div class="row"><span class="label">Country:</span> <span id="country-detail" class="value"></span></div>
      <div class="row"><span class="label">City:</span> <span id="city" class="value"></span></div>
      <div class="row"><span class="label">ISP:</span> <span id="isp" class="value"></span></div>
      <div class="row"><span class="label">Organization:</span> <span id="org" class="value"></span></div>
      <div class="row"><span class="label">ASN:</span> <span id="asn" class="value"></span></div>
      <div class="row"><span class="label">Timezone:</span> <span id="timezone" class="value"></span></div>
    </div>
    <div id="error" class="error" style="display: none;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
